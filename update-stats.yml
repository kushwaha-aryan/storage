name: Update stats cards

on:
  schedule:
    - cron: "0 * * * *"      # every hour (GitHub may delay scheduled runs a bit)
  workflow_dispatch:          # lets you run it manually from the Actions tab
  push:
    branches: [main]
    paths:
      - "scripts/generate_stats.py"
      - ".github/workflows/update-stats.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate stats cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: kushwaha-aryan
          OUT_DIR: "."
        run: python scripts/generate_stats.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.svg languages.svg
          git diff --cached --quiet || git commit -m "chore: update stats cards"
          git push
